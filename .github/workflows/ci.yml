name: CI

on:
  push:
    branches:
      - "release/*"
      - develop
      - main
  pull_request:
    branches: [develop, main]

permissions:
  contents: write
  packages: write

jobs:
  ci:
    uses: mario-noobs/ci-baseline/.github/workflows/_ci-python.yml@main
    with:
      python_version: "3.10"
      test_enabled: true
      sonar_project_key: mario-noobs_face-ai-service
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker:
    needs: ci
    if: github.event_name == 'push'
    uses: mario-noobs/ci-baseline/.github/workflows/_docker-build.yml@main
    with:
      image_name: face-ai-service
      context: "."

  dispatch:
    name: Notify orchestrator
    needs: docker
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch to face-microservice
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.ORCHESTRATOR_DISPATCH_TOKEN }}
          repository: mario-noobs/face-microservice
          event-type: service-image-published
          client-payload: |
            {
              "service": "face-ai-service",
              "tag": "${{ needs.docker.outputs.image_tag }}"
            }
